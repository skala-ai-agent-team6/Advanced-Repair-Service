[project]
name = "appliance-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "huggingface-hub>=2.2.0",
    "ultralytics>=8.4.183",
    "open-clip-torch>=2.32.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "openai>=3.37.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
