server.servlet.session.cookie.secure=false
# [통합] dev 계정 비밀번호 기본값 1234 (로컬 시연 편의, dev 프로필 전용)
app.seed-password=${DEV_PASSWORD:1234}
# [출장] 고객 접수 → 출장기사 자동 배정 → AI 진단 자동 시작 (ConsumerPipeline)
app.consumer.auto-pipeline=true

# Preserve the existing demo flow explicitly; automation is recorded separately in audit_log.
app.consumer.allow-warning-photos=true
